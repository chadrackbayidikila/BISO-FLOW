<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BISO FLOW</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);--nav:#0B1F3A;--nav2:#16305a;--tq:#14B8A6;--tqd:#0d8f81;--bg:#EEF2F6;--sf:#fff;--tx:#0f1b2d;--mu:#5d6b80;--bd:#dde4ec;--rd:#d64545;--am:#b7791f}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0a1424;--sf:#12223b;--tx:#e8eef7;--mu:#97a6bd;--bd:#25395a;--nav:#06101f}}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Plus Jakarta Sans","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--tq);outline-offset:2px}
#app{display:flex;min-height:100%}
aside{display:none;width:230px;background:var(--nav);color:#fff;padding:20px 14px;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
aside .logo{font-weight:800;font-size:19px;letter-spacing:.5px;padding:4px 10px 18px}
aside .logo b{color:var(--tq)}
.nb{display:flex;align-items:center;gap:10px;background:none;border:0;color:#b9c7dd;padding:11px 12px;border-radius:10px;cursor:pointer;text-align:left;width:100%}
.nb.on{background:var(--nav2);color:#fff}
.nb svg{width:20px;height:20px;flex:none}
main{flex:1;min-width:0;padding:16px 16px 90px;max-width:980px;margin:0 auto;width:100%}
nav.bot{position:fixed;bottom:0;left:0;right:0;background:var(--nav);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav.bot .nb{flex-direction:column;gap:2px;font-size:11px;justify-content:center;align-items:center;padding:6px 2px}
@media(min-width:800px){aside{display:flex}nav.bot{display:none}main{padding:28px 32px}}
h1{font-size:22px;margin:0 0 14px;letter-spacing:-.3px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.top h1{margin:0}
.btn{background:var(--tq);color:#042a26;border:0;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer}
.btn:hover{background:#2dd4c2}
.btn.g{background:var(--sf);color:var(--tx);border:1px solid var(--bd)}
.btn.d{background:#fdecec;color:var(--rd)}
.btn.s{padding:6px 11px;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}
@media(min-width:800px){.grid{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:12px 14px}
.kpi small{color:var(--mu)}
.kpi b{display:block;font-size:22px;margin-top:2px}
.kpi.hero{grid-column:1/-1;background:var(--nav);color:#fff;border:0}
.kpi.hero small{color:#9fb2cf}.kpi.hero b{font-size:30px;color:var(--tq)}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer}
.row small,.mu{color:var(--mu)}
.tag{display:inline-block;border-radius:99px;padding:2px 9px;font-size:12px;font-weight:600;background:#e3ebf5;color:#27466e;white-space:nowrap}
.tag.ok{background:#d6f5f0;color:#0b6b5f}.tag.w{background:#fdf0d5;color:var(--am)}.tag.x{background:#fdecec;color:var(--rd)}
@media(prefers-color-scheme:dark){.tag{background:#1c3157;color:#b9d0f3}.tag.ok{background:#0f3d3a;color:#6ff0df}.tag.w{background:#3d3014;color:#f3c96b}.tag.x{background:#431b1b;color:#ff9a9a}}
.bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
input,select,textarea{width:100%;background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:10px 12px}
.bar input{flex:1;min-width:140px}.bar select{width:auto}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
.empty{text-align:center;color:var(--mu);padding:30px 10px}
#ov{position:fixed;inset:0;background:rgba(5,12,24,.6);display:none;align-items:flex-end;justify-content:center;z-index:10}
#ov.on{display:flex}
#md{background:var(--sf);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
@media(min-width:800px){#ov{align-items:center}#md{border-radius:18px}}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.line{display:flex;gap:8px;align-items:center;margin-bottom:6px}.line span{flex:1}
.line input{width:64px;text-align:center}
.tot{font-size:18px;font-weight:800;text-align:right;margin:10px 0}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.hist{font-size:13px;color:var(--mu);border-left:2px solid var(--bd);padding-left:10px;margin:4px 0}
#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--nav);color:#fff;padding:10px 16px;border-radius:10px;display:none;z-index:20}
</style></head>
<body>
<div id="app">
<aside id="side"></aside>
<main id="main"></main>
</div>
<nav class="bot" id="bot"></nav>
<div id="ov"><div id="md" role="dialog" aria-modal="true"></div></div>
<div id="toast" role="status"></div>
<script>
const KEY='bisoflow-v1';
const ST=['Brouillon','En attente','Confirmée','En préparation','Prête','En livraison','Terminée','Annulée'];
const FLOW=['En attente','Confirmée','En préparation','Prête','En livraison','Terminée'];
const MET=['Espèces','Mobile Money','Virement'];
const ic={home:'<path d="M3 11l9-8 9 8v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z"/>',ord:'<path d="M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6"/>',cli:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',pro:'<path d="M3 7l9-4 9 4v10l-9 4-9-4zM3 7l9 4 9-4M12 11v10"/>'};
ic.net='<circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8.2 11l7.6-4M8.2 13l7.6 4"/>';
const TABS=[['home','Accueil','home'],['ord','Commandes','ord'],['cli','Clients','cli'],['pro','Produits','pro'],['net','Réseau','net']];
let tab='home',q='',fs='',fp='',sub='mis';
let db=load();['partners','couriers','missions'].forEach(k=>{db[k]=db[k]||[]});
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.orders)return d}catch(e){}
return{n:0,products:[
{id:'p1',name:'Poulet braisé',cat:'Plats',price:4500,on:true,desc:'Avec bananes plantain'},
{id:'p2',name:'Poisson capitaine',cat:'Plats',price:6000,on:true,desc:''},
{id:'p3',name:'Jus de bissap',cat:'Boissons',price:1000,on:true,desc:'33 cl'}],customers:[],orders:[]}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){toast('Enregistrement local impossible')}}
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fm=n=>new Intl.NumberFormat('fr-FR').format(Math.round(n))+' FCFA';
const fd=t=>new Date(t).toLocaleString('fr-FR',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
const uid=()=>Math.random().toString(36).slice(2,9);
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',2200)}
/* --- calculs --- */
function total(items,fee,disc){const s=items.reduce((a,i)=>a+i.price*i.qty,0);return Math.max(0,s+(+fee||0)-(+disc||0))}
function paid(o){return o.pays.filter(p=>p.ok).reduce((a,p)=>a+p.amt,0)}
function pending(o){return o.pays.filter(p=>!p.ok).reduce((a,p)=>a+p.amt,0)}
function payStatus(o){const p=paid(o);if(p>=o.total&&o.total>0)return'Payé';if(p>0)return'Partiellement payé';if(pending(o)>0)return'En attente de vérification';return'Non payé'}
function stTag(s){return`<span class="tag ${s==='Terminée'?'ok':s==='Annulée'?'x':s==='En attente'?'w':''}">${s}</span>`}
function pTag(s){return`<span class="tag ${s==='Payé'?'ok':s==='Non payé'?'x':'w'}">${s}</span>`}
function log(o,t){o.hist.unshift({t:Date.now(),m:t});o.upd=Date.now()}
/* --- navigation --- */
function nav(){const h=TABS.map(([k,l,i])=>`<button class="nb ${tab===k?'on':''}" onclick="go('${k}')" aria-label="${l}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ic[i]}</svg>${l}</button>`).join('');
$('#bot').innerHTML=h;$('#side').innerHTML='<div class="logo">BISO <b>FLOW</b></div>'+h}
function go(t){tab=t;q='';fs='';fp='';render()}
function render(){nav();$('#main').innerHTML=({home:vHome,ord:vOrders,cli:vClients,pro:vProducts,net:vNet})[tab]();window.scrollTo(0,0)}
/* --- accueil --- */
function vHome(){const o=db.orders,c=s=>o.filter(x=>x.status===s).length;
const ca=o.filter(x=>x.status!=='Annulée').reduce((a,x)=>a+paid(x),0);
const att=o.filter(x=>x.status!=='Annulée'&&x.status!=='Brouillon').reduce((a,x)=>a+Math.max(0,x.total-paid(x)),0);
const act=o.flatMap(x=>x.hist.map(h=>({...h,r:x.ref,id:x.id}))).sort((a,b)=>b.t-a.t).slice(0,8);
return`<h1>Tableau de bord</h1><div class="grid">
<div class="kpi hero"><small>Chiffre d’affaires encaissé</small><b>${fm(ca)}</b></div>
<div class="kpi"><small>Commandes</small><b>${o.length}</b></div>
<div class="kpi"><small>Paiements à recevoir</small><b>${fm(att)}</b></div>
<div class="kpi"><small>Missions en cours</small><b>${db.missions.filter(m=>m.status==='Assignée'||m.status==='En cours').length}</b></div>
${['En attente','Confirmée','En préparation','En livraison','Terminée','Annulée'].map(s=>`<div class="kpi"><small>${s}</small><b>${c(s)}</b></div>`).join('')}</div>
<h1 style="font-size:17px">Activité récente</h1>
${act.length?act.map(a=>`<div class="card row" onclick="openOrder('${a.id}')"><span>${esc(a.m)}<br><small>${a.r}</small></span><small>${fd(a.t)}</small></div>`).join(''):'<div class="empty">Aucune activité. Créez votre première commande.<br><br><button class="btn" onclick="go(\'ord\');newOrder()">Nouvelle commande</button></div>'}`}
/* --- commandes --- */
function vOrders(){const l=db.orders.filter(o=>(!fs||o.status===fs)&&(!fp||payStatus(o)===fp)&&(!q||(o.ref+o.name+o.phone).toLowerCase().includes(q.toLowerCase())));
return`<div class="top"><h1>Commandes</h1><span><button class="btn g s" onclick="csv()">Export CSV</button> <button class="btn" onclick="newOrder()">+ Nouvelle</button></span></div>
<div class="bar"><input placeholder="Rechercher (référence, nom, téléphone)" value="${esc(q)}" oninput="q=this.value;refList()" aria-label="Rechercher">
<select onchange="fs=this.value;refList()" aria-label="Statut"><option value="">Tous statuts</option>${ST.map(s=>`<option ${fs===s?'selected':''}>${s}</option>`).join('')}</select>
<select onchange="fp=this.value;refList()" aria-label="Paiement"><option value="">Tous paiements</option>${['Non payé','En attente de vérification','Partiellement payé','Payé'].map(s=>`<option ${fp===s?'selected':''}>${s}</option>`).join('')}</select></div><div id="list">${oList(l)}</div>`}
function oList(l){return l.length?l.map(o=>`<div class="card row" onclick="openOrder('${o.id}')"><span><b>${o.ref}</b> · ${esc(o.name)}<br><small>${fd(o.created)} · ${fm(o.total)}</small></span><span style="text-align:right">${stTag(o.status)}<br>${pTag(payStatus(o))}</span></div>`).join(''):'<div class="empty">Aucune commande ne correspond.</div>'}
function refList(){const l=db.orders.filter(o=>(!fs||o.status===fs)&&(!fp||payStatus(o)===fp)&&(!q||(o.ref+o.name+o.phone).toLowerCase().includes(q.toLowerCase())));$('#list').innerHTML=oList(l)}
function modal(h){$('#md').innerHTML=h;$('#ov').classList.add('on')}
function closeM(){$('#ov').classList.remove('on')}
$('#ov').addEventListener('click',e=>{if(e.target.id==='ov')closeM()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeM()});
let cart={};
function newOrder(){cart={};const act=db.products.filter(p=>p.on);
modal(`<h1>Nouvelle commande</h1>
<label>Client existant</label><select id="oc" onchange="fillC()"><option value="">— Nouveau client —</option>${db.customers.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select>
<div class="two"><div><label>Nom *</label><input id="on"></div><div><label>Téléphone *</label><input id="op" inputmode="tel"></div></div>
<label>Adresse</label><input id="oa">
<label>Produits</label>${act.length?act.map(p=>`<div class="line"><span>${esc(p.name)}<br><small class="mu">${fm(p.price)}</small></span><button class="btn g s" onclick="qty('${p.id}',-1)">−</button><input id="q${p.id}" value="0" readonly aria-label="Quantité"><button class="btn g s" onclick="qty('${p.id}',1)">+</button></div>`).join(''):'<p class="mu">Ajoutez d’abord des produits actifs.</p>'}
<div class="two"><div><label>Frais (livraison…)</label><input id="of" type="number" min="0" value="0" oninput="tt()"></div><div><label>Réduction</label><input id="od" type="number" min="0" value="0" oninput="tt()"></div></div>
<label>Notes internes</label><textarea id="ono" rows="2"></textarea>
<div class="tot" id="tt">0 FCFA</div>
<div class="acts"><button class="btn" onclick="saveOrder()">Créer la commande</button><button class="btn g" onclick="closeM()">Annuler</button></div>`)}
function fillC(){const c=db.customers.find(x=>x.id===$('#oc').value);if(c){$('#on').value=c.name;$('#op').value=c.phone;$('#oa').value=c.addr||''}}
function qty(id,d){cart[id]=Math.max(0,(cart[id]||0)+d);$('#q'+id).value=cart[id];tt()}
function cartItems(){return db.products.filter(p=>cart[p.id]>0).map(p=>({pid:p.id,name:p.name,price:p.price,qty:cart[p.id]}))}
function tt(){$('#tt').textContent=fm(total(cartItems(),$('#of').value,$('#od').value))}
function saveOrder(){const name=$('#on').value.trim(),phone=$('#op').value.trim(),items=cartItems();
if(!name||!phone)return toast('Nom et téléphone obligatoires');
if(!items.length)return toast('Ajoutez au moins un produit');
const fee=Math.max(0,+$('#of').value||0),disc=Math.max(0,+$('#od').value||0);
let c=db.customers.find(x=>x.phone===phone);
if(!c){c={id:uid(),name,phone,addr:$('#oa').value.trim(),notes:''};db.customers.push(c)}
db.n++;const o={id:uid(),ref:'BF-'+String(db.n).padStart(4,'0'),cid:c.id,name,phone,addr:$('#oa').value.trim(),items,fee,disc,total:total(items,fee,disc),status:'En attente',pays:[],notes:$('#ono').value.trim(),created:Date.now(),upd:Date.now(),hist:[]};
log(o,'Commande créée');db.orders.unshift(o);save();closeM();render();toast('Commande '+o.ref+' créée')}
function openOrder(id){const o=db.orders.find(x=>x.id===id);if(!o)return;
const i=FLOW.indexOf(o.status),nx=i>=0&&i<FLOW.length-1?FLOW[i+1]:null,ps=payStatus(o),rest=o.total-paid(o);
modal(`<div class="top"><h1>${o.ref}</h1>${stTag(o.status)}</div>
<p><b>${esc(o.name)}</b> · <a href="tel:${esc(o.phone)}" style="color:var(--tqd)">${esc(o.phone)}</a><br><span class="mu">${esc(o.addr)||'Pas d’adresse'}</span></p>
${o.items.map(x=>`<div class="line"><span>${x.qty} × ${esc(x.name)}</span><b>${fm(x.price*x.qty)}</b></div>`).join('')}
${o.fee?`<div class="line"><span>Frais</span>${fm(o.fee)}</div>`:''}${o.disc?`<div class="line"><span>Réduction</span>− ${fm(o.disc)}</div>`:''}
<div class="tot">${fm(o.total)}</div>
<div class="card"><div class="row" style="cursor:default"><b>Paiement</b>${pTag(ps)}</div>
${o.pays.map((p,k)=>`<div class="line" style="margin-top:8px"><span>${fm(p.amt)} · ${p.method}${p.ref?' · '+esc(p.ref):''}<br><small class="mu">${fd(p.t)}${p.ok?'':' · à vérifier'}</small></span>${p.ok?'':`<button class="btn s" onclick="okPay('${o.id}',${k})">Valider</button>`}</div>`).join('')}
${o.status!=='Annulée'&&rest>0?`<div class="two" style="margin-top:8px"><input id="pa" type="number" min="1" value="${rest}" aria-label="Montant"><select id="pm">${MET.map(m=>`<option>${m}</option>`).join('')}</select></div><input id="pr" placeholder="Référence transaction (facultatif)" style="margin-top:8px"><button class="btn s" style="margin-top:8px" onclick="addPay('${o.id}')">Enregistrer le paiement</button>`:''}</div>
<div class="card"><b>Coordination</b><label>Partenaire responsable</label><select onchange="setPartner('${o.id}',this.value)"><option value="">— Aucun —</option>${db.partners.filter(p=>p.status==='Actif'||p.id===o.pid).map(p=>`<option value="${p.id}" ${o.pid===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select>${missionBlock(o)}</div>
<label>Notes internes</label><textarea rows="2" onchange="note('${o.id}',this.value)">${esc(o.notes)}</textarea>
<div class="acts">${nx&&o.status!=='Annulée'?`<button class="btn" onclick="setSt('${o.id}','${nx}')">Passer à « ${nx} »</button>`:''}
${o.status!=='Annulée'&&o.status!=='Terminée'?`<button class="btn d" onclick="cancelO('${o.id}')">Annuler</button>`:''}<button class="btn g" onclick="closeM()">Fermer</button></div>
<h1 style="font-size:15px;margin-top:18px">Historique</h1>${o.hist.map(h=>`<div class="hist">${esc(h.m)} <small>· ${fd(h.t)}</small></div>`).join('')}`)}
function setSt(id,s){const o=db.orders.find(x=>x.id===id);if(s==='Annulée')db.missions.filter(m=>m.oid===id&&(m.status==='Assignée'||m.status==='En cours')).forEach(m=>m.status='Annulée');log(o,`Statut : ${o.status} → ${s}`);o.status=s;save();render();openOrder(id)}
function cancelO(id){if(!confirm('Annuler cette commande ? Cette action est conservée dans l’historique.'))return;setSt(id,'Annulée')}
function note(id,v){const o=db.orders.find(x=>x.id===id);o.notes=v;o.upd=Date.now();save()}
function addPay(id){const o=db.orders.find(x=>x.id===id),amt=+$('#pa').value,m=$('#pm').value;
if(!(amt>0))return toast('Montant invalide');
if(amt>o.total-paid(o)-pending(o)+(pending(o)?0:0)&&amt>o.total-paid(o))return toast('Montant supérieur au solde');
o.pays.push({amt,method:m,ref:$('#pr').value.trim(),t:Date.now(),ok:m!=='Mobile Money'});
log(o,`Paiement enregistré : ${fm(amt)} (${m})`);save();render();openOrder(id)}
function okPay(id,k){const o=db.orders.find(x=>x.id===id);o.pays[k].ok=true;log(o,'Paiement vérifié : '+fm(o.pays[k].amt));save();render();openOrder(id)}
function csv(){const r=[['Référence','Date','Client','Téléphone','Statut','Paiement','Total','Encaissé']].concat(db.orders.map(o=>[o.ref,new Date(o.created).toISOString().slice(0,10),o.name,o.phone,o.status,payStatus(o),o.total,paid(o)]));
const t=r.map(a=>a.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\n');
const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+t],{type:'text/csv'}));a.download='commandes.csv';a.click()}
/* --- clients --- */
function vClients(){const l=db.customers.filter(c=>!q||(c.name+c.phone).toLowerCase().includes(q.toLowerCase()));
return`<div class="top"><h1>Clients</h1><button class="btn" onclick="editC()">+ Client</button></div>
<div class="bar"><input placeholder="Rechercher un client" value="${esc(q)}" oninput="q=this.value;$('#cl').innerHTML=cList()"></div><div id="cl">${cList()}</div>`}
function cList(){const l=db.customers.filter(c=>!q||(c.name+c.phone).toLowerCase().includes(q.toLowerCase()));
return l.length?l.map(c=>{const os=db.orders.filter(o=>o.cid===c.id&&o.status!=='Annulée');return`<div class="card row" onclick="editC('${c.id}')"><span><b>${esc(c.name)}</b><br><small>${esc(c.phone)}</small></span><span style="text-align:right"><b>${fm(os.reduce((a,o)=>a+o.total,0))}</b><br><small>${os.length} commande(s)</small></span></div>`}).join(''):'<div class="empty">Aucun client. Ils sont ajoutés automatiquement à chaque commande.</div>'}
function editC(id){const c=db.customers.find(x=>x.id===id)||{name:'',phone:'',addr:'',notes:''};
const os=id?db.orders.filter(o=>o.cid===id):[];
modal(`<h1>${id?'Fiche client':'Nouveau client'}</h1><label>Nom *</label><input id="cn" value="${esc(c.name)}"><label>Téléphone *</label><input id="cp" inputmode="tel" value="${esc(c.phone)}"><label>Adresse</label><input id="ca" value="${esc(c.addr)}"><label>Notes internes</label><textarea id="cno" rows="2">${esc(c.notes)}</textarea>
<div class="acts"><button class="btn" onclick="saveC('${id||''}')">Enregistrer</button><button class="btn g" onclick="closeM()">Fermer</button></div>
${os.length?`<h1 style="font-size:15px;margin-top:18px">Historique</h1>${os.map(o=>`<div class="card row" onclick="openOrder('${o.id}')"><span>${o.ref}<br><small>${fm(o.total)}</small></span>${stTag(o.status)}</div>`).join('')}`:''}`)}
function saveC(id){const n=$('#cn').value.trim(),p=$('#cp').value.trim();if(!n||!p)return toast('Nom et téléphone obligatoires');
let c=db.customers.find(x=>x.id===id);if(!c){c={id:uid()};db.customers.push(c)}Object.assign(c,{name:n,phone:p,addr:$('#ca').value.trim(),notes:$('#cno').value.trim()});save();closeM();render();toast('Client enregistré')}
/* --- produits --- */
function vProducts(){return`<div class="top"><h1>Produits et services</h1><button class="btn" onclick="editP()">+ Produit</button></div>
${db.products.length?db.products.map(p=>`<div class="card row" onclick="editP('${p.id}')"><span><b>${esc(p.name)}</b><br><small>${esc(p.cat)||'Sans catégorie'}</small></span><span style="text-align:right"><b>${fm(p.price)}</b><br><span class="tag ${p.on?'ok':'x'}">${p.on?'Disponible':'Désactivé'}</span></span></div>`).join(''):'<div class="empty">Aucun produit. Ajoutez votre premier produit ou service.</div>'}`}
function editP(id){const p=db.products.find(x=>x.id===id)||{name:'',cat:'',price:'',on:true,desc:''};
modal(`<h1>${id?'Modifier':'Nouveau produit'}</h1><label>Nom *</label><input id="pn" value="${esc(p.name)}"><div class="two"><div><label>Prix (FCFA) *</label><input id="pp" type="number" min="0" value="${p.price}"></div><div><label>Catégorie</label><input id="pc" value="${esc(p.cat)}"></div></div><label>Description</label><textarea id="pd" rows="2">${esc(p.desc)}</textarea>
<label><input type="checkbox" id="po" ${p.on?'checked':''} style="width:auto"> Disponible à la commande</label>
<div class="acts"><button class="btn" onclick="saveP('${id||''}')">Enregistrer</button><button class="btn g" onclick="closeM()">Fermer</button></div>`)}
function saveP(id){const n=$('#pn').value.trim(),pr=+$('#pp').value;if(!n||!(pr>=0)||$('#pp').value==='')return toast('Nom et prix obligatoires');
let p=db.products.find(x=>x.id===id);if(!p){p={id:uid()};db.products.push(p)}Object.assign(p,{name:n,price:pr,cat:$('#pc').value.trim(),desc:$('#pd').value.trim(),on:$('#po').checked});save();closeM();render();toast('Produit enregistré')}

/* --- réseau : partenaires, livreurs, missions --- */
const MS=['Assignée','En cours','Terminée','Annulée'];
function mTag(s){return`<span class="tag ${s==='Terminée'?'ok':s==='Annulée'?'x':s==='Assignée'?'w':''}">${s}</span>`}
function vNet(){const S=[['par','Partenaires'],['liv','Livreurs'],['mis','Missions']];
const seg=`<div class="bar">${S.map(([k,l])=>`<button class="btn s ${sub===k?'':'g'}" style="flex:1" onclick="sub='${k}';fs='';render()">${l}</button>`).join('')}</div>`;
if(sub==='par')return`<div class="top"><h1>Partenaires</h1><button class="btn" onclick="editPar()">+ Partenaire</button></div>${seg}`+(db.partners.length?db.partners.map(p=>`<div class="card row" onclick="editPar('${p.id}')"><span><b>${esc(p.name)}</b><br><small>${esc(p.activity)||'Activité non précisée'}${p.phone?' · '+esc(p.phone):''}</small></span><span style="text-align:right"><span class="tag ${p.status==='Actif'?'ok':p.status==='En pause'?'w':'x'}">${p.status}</span><br><small>${db.orders.filter(o=>o.pid===p.id).length} commande(s)</small></span></div>`).join(''):'<div class="empty">Aucun partenaire. Ajoutez un restaurant, un fournisseur ou un prestataire.</div>');
if(sub==='liv')return`<div class="top"><h1>Livreurs</h1><button class="btn" onclick="editCour()">+ Livreur</button></div>${seg}`+(db.couriers.length?db.couriers.map(c=>{const dn=db.missions.filter(m=>m.cid===c.id&&m.status==='Terminée'),due=dn.filter(m=>!m.fpaid).reduce((a,m)=>a+m.fee,0);return`<div class="card row" onclick="editCour('${c.id}')"><span><b>${esc(c.name)}</b> ${c.on?'':'<span class="tag x">Indisponible</span>'}<br><small>${esc(c.phone)}${c.zone?' · '+esc(c.zone):''}</small></span><span style="text-align:right"><b>${dn.length}</b> <small>terminée(s)</small><br><small>À payer : ${fm(due)}</small></span></div>`}).join(''):'<div class="empty">Aucun livreur. Ajoutez votre premier livreur pour affecter des missions.</div>');
const l=db.missions.filter(m=>!fs||m.status===fs).sort((a,b)=>b.created-a.created);
return`<div class="top"><h1>Missions</h1></div>${seg}<div class="bar"><select onchange="fs=this.value;render()" aria-label="Statut"><option value="">Tous statuts</option>${MS.map(s=>`<option ${fs===s?'selected':''}>${s}</option>`).join('')}</select></div>`+(l.length?l.map(m=>{const c=db.couriers.find(x=>x.id===m.cid);return`<div class="card row" onclick="openMission('${m.id}')"><span><b>${m.ref}</b> · ${esc(c?c.name:'—')}<br><small>${esc(m.name)} · ${fm(m.fee)}${m.fpaid?' · payée':''}</small></span>${mTag(m.status)}</div>`}).join(''):'<div class="empty">Aucune mission. Affectez un livreur depuis le détail d’une commande.</div>')}
function editPar(id){const p=db.partners.find(x=>x.id===id)||{name:'',phone:'',activity:'',offer:'',rates:'',avail:'',status:'Actif',notes:''};
modal(`<h1>${id?'Fiche partenaire':'Nouveau partenaire'}</h1><label>Nom *</label><input id="rn" value="${esc(p.name)}"><div class="two"><div><label>Téléphone</label><input id="rp" inputmode="tel" value="${esc(p.phone)}"></div><div><label>Activité</label><input id="ra" value="${esc(p.activity)}" placeholder="Restaurant, fournisseur…"></div></div><label>Produits ou services</label><input id="ro" value="${esc(p.offer)}"><div class="two"><div><label>Tarifs</label><input id="rr" value="${esc(p.rates)}"></div><div><label>Disponibilités</label><input id="rd" value="${esc(p.avail)}" placeholder="Lun–Sam, 8h–20h"></div></div><label>Statut de collaboration</label><select id="rs">${['Actif','En pause','Terminé'].map(s=>`<option ${p.status===s?'selected':''}>${s}</option>`).join('')}</select><label>Notes</label><textarea id="rt" rows="2">${esc(p.notes)}</textarea>
<div class="acts"><button class="btn" onclick="savePar('${id||''}')">Enregistrer</button><button class="btn g" onclick="closeM()">Fermer</button></div>`)}
function savePar(id){const n=$('#rn').value.trim();if(!n)return toast('Le nom est obligatoire');
let p=db.partners.find(x=>x.id===id);if(!p){p={id:uid()};db.partners.push(p)}
Object.assign(p,{name:n,phone:$('#rp').value.trim(),activity:$('#ra').value.trim(),offer:$('#ro').value.trim(),rates:$('#rr').value.trim(),avail:$('#rd').value.trim(),status:$('#rs').value,notes:$('#rt').value.trim()});save();closeM();render();toast('Partenaire enregistré')}
function editCour(id){const c=db.couriers.find(x=>x.id===id)||{name:'',phone:'',zone:'',on:true,notes:''};const ms=id?db.missions.filter(m=>m.cid===id):[];
modal(`<h1>${id?'Fiche livreur':'Nouveau livreur'}</h1><label>Nom *</label><input id="ln" value="${esc(c.name)}"><div class="two"><div><label>Téléphone *</label><input id="lp" inputmode="tel" value="${esc(c.phone)}"></div><div><label>Zone</label><input id="lz" value="${esc(c.zone)}" placeholder="Ex. Bacongo"></div></div><label>Notes</label><textarea id="lt" rows="2">${esc(c.notes)}</textarea>
<label><input type="checkbox" id="lo" ${c.on?'checked':''} style="width:auto"> Disponible pour de nouvelles missions</label>
<div class="acts"><button class="btn" onclick="saveCour('${id||''}')">Enregistrer</button><button class="btn g" onclick="closeM()">Fermer</button></div>
${ms.length?`<h1 style="font-size:15px;margin-top:18px">Missions</h1>${ms.map(m=>`<div class="card row" onclick="openMission('${m.id}')"><span>${m.ref}<br><small>${fm(m.fee)}${m.fpaid?' · payée':''}</small></span>${mTag(m.status)}</div>`).join('')}`:''}`)}
function saveCour(id){const n=$('#ln').value.trim(),p=$('#lp').value.trim();if(!n||!p)return toast('Nom et téléphone obligatoires');
let c=db.couriers.find(x=>x.id===id);if(!c){c={id:uid()};db.couriers.push(c)}
Object.assign(c,{name:n,phone:p,zone:$('#lz').value.trim(),notes:$('#lt').value.trim(),on:$('#lo').checked});save();closeM();render();toast('Livreur enregistré')}
function missionBlock(o){const m=db.missions.find(x=>x.oid===o.id&&x.status!=='Annulée');
if(m){const c=db.couriers.find(x=>x.id===m.cid);return`<div class="row" style="margin-top:10px" onclick="openMission('${m.id}')"><span>Livreur : <b>${esc(c?c.name:'—')}</b><br><small>Rémunération ${fm(m.fee)}</small></span>${mTag(m.status)}</div>`}
if(o.status==='Annulée'||o.status==='Terminée')return'';
const cs=db.couriers.filter(c=>c.on);
return cs.length?`<label>Livreur</label><select id="mc">${cs.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select><label>Rémunération (FCFA)</label><input id="mf" type="number" min="0" value="0"><button class="btn s" style="margin-top:8px" onclick="assign('${o.id}')">Affecter la mission</button>`:'<p class="mu">Ajoutez un livreur dans Réseau pour affecter une mission.</p>'}
function setPartner(id,v){const o=db.orders.find(x=>x.id===id),p=db.partners.find(x=>x.id===v);o.pid=v;log(o,'Partenaire : '+(p?p.name:'aucun'));save();toast('Partenaire mis à jour')}
function assign(id){const o=db.orders.find(x=>x.id===id),c=db.couriers.find(x=>x.id===$('#mc').value),fee=Math.max(0,+$('#mf').value||0);if(!c)return toast('Choisissez un livreur');
db.missions.push({id:uid(),oid:o.id,ref:o.ref,name:o.name,addr:o.addr,cid:c.id,fee,status:'Assignée',fpaid:false,created:Date.now()});
log(o,'Mission affectée à '+c.name);save();render();openOrder(id);toast('Mission affectée')}
function openMission(id){const m=db.missions.find(x=>x.id===id);if(!m)return;const c=db.couriers.find(x=>x.id===m.cid),nx={'Assignée':'En cours','En cours':'Terminée'}[m.status];
modal(`<div class="top"><h1>Mission ${m.ref}</h1>${mTag(m.status)}</div>
<p><b>Livreur :</b> ${esc(c?c.name:'—')} ${c?`· <a href="tel:${esc(c.phone)}" style="color:var(--tqd)">${esc(c.phone)}</a>`:''}<br><b>Client :</b> ${esc(m.name)}<br><span class="mu">${esc(m.addr)||'Pas d’adresse'}</span></p>
<div class="card"><div class="row" style="cursor:default"><b>Rémunération</b><span>${fm(m.fee)} <span class="tag ${m.fpaid?'ok':'w'}">${m.fpaid?'Payée':'À payer'}</span></span></div></div>
<div class="acts">${nx?`<button class="btn" onclick="setMs('${m.id}','${nx}')">Passer à « ${nx} »</button>`:''}
${m.status==='Terminée'&&!m.fpaid?`<button class="btn" onclick="payM('${m.id}')">Marquer la rémunération payée</button>`:''}
${m.status==='Assignée'||m.status==='En cours'?`<button class="btn d" onclick="cancelM('${m.id}')">Annuler</button>`:''}
${db.orders.some(o=>o.id===m.oid)?`<button class="btn g" onclick="openOrder('${m.oid}')">Voir la commande</button>`:''}<button class="btn g" onclick="closeM()">Fermer</button></div>`)}
function setMs(id,s){const m=db.missions.find(x=>x.id===id),o=db.orders.find(x=>x.id===m.oid);m.status=s;if(s==='Terminée')m.done=Date.now();if(o)log(o,'Mission : '+s);save();render();openMission(id)}
function payM(id){const m=db.missions.find(x=>x.id===id),o=db.orders.find(x=>x.id===m.oid);m.fpaid=true;if(o)log(o,'Rémunération livreur payée : '+fm(m.fee));save();render();openMission(id)}
function cancelM(id){if(!confirm('Annuler cette mission ?'))return;setMs(id,'Annulée')}
render();
</script></body></html>
