<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Commander</title>
<style>
:root{padding-top:env(safe-area-inset-top,0px);--nav:#0B1F3A;--tq:#14B8A6;--bg:#EEF2F6;--sf:#fff;--tx:#0f1b2d;--mu:#5d6b80;--bd:#dde4ec}
@media(prefers-color-scheme:dark){:root{--bg:#0a1424;--sf:#12223b;--tx:#e8eef7;--mu:#97a6bd;--bd:#25395a}}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:16px;line-height:1.45}
button,input,textarea{font:inherit;color:inherit}
.hd{background:var(--nav);color:#fff;padding:16px;font-weight:800}.hd b{color:var(--tq)}
main{max-width:560px;margin:0 auto;padding:16px 16px calc(40px + env(safe-area-inset-bottom,0px))}
h1{font-size:22px;margin:0 0 12px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:10px}
.mu{color:var(--mu)}small{color:var(--mu)}
.line{display:flex;gap:8px;align-items:center}.line>span{flex:1}
.line input{width:56px;text-align:center}
input,textarea{width:100%;background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:10px 12px}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
.btn{background:var(--tq);color:#042a26;border:0;border-radius:10px;padding:12px 18px;font-weight:700;cursor:pointer;width:100%;margin-top:12px}
.btn.s{width:auto;margin:0;padding:6px 12px;background:var(--sf);color:var(--tx);border:1px solid var(--bd)}
.btn:disabled{opacity:.5}
.tot{font-size:20px;font-weight:800;text-align:right;margin:10px 0}
#err{color:#d64545;margin-top:8px}
</style></head>
<body>
<div class="hd" id="t">BISO <b>FLOW</b></div>
<main id="m"><p class="mu">Chargement…</p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script>
<script>
const SB=supabase.createClient('https://gxxdezyxhzvqbadxctet.supabase.co','sb_publishable_HiyA8ZnqhJTY1FK4ALIuEQ_ecHm0mUl');
const slug=(new URLSearchParams(location.search).get('e')||'').toLowerCase();
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fm=n=>new Intl.NumberFormat('fr-FR').format(Math.round(n))+' FCFA';
const uuid=()=>crypto.randomUUID?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return(c==='x'?r:(r&3|8)).toString(16)});
let P=[],cart={},key=uuid(),co='';
async function init(){
 const{data,error}=await SB.rpc('public_company_info',{p_slug:slug});
 if(error||!data){$('#m').innerHTML='<div class="card">Ce lien de commande n’est pas disponible.</div>';return}
 co=data.name;P=data.products;document.title='Commander · '+co;$('#t').textContent=co;
 $('#m').innerHTML=`<h1>Passer une commande</h1>
${P.length?P.map(p=>`<div class="card line"><span><b>${esc(p.name)}</b><br><small>${esc(p.description||p.category||'')}</small><br><b>${fm(p.price)}</b></span><button class="btn s" onclick="qty('${p.id}',-1)" aria-label="Moins">−</button><input id="q${p.id}" value="0" readonly aria-label="Quantité"><button class="btn s" onclick="qty('${p.id}',1)" aria-label="Plus">+</button></div>`).join(''):'<div class="card mu">Aucun produit disponible pour le moment.</div>'}
<div class="tot" id="tt">0 FCFA</div>
<label>Votre nom *</label><input id="n" autocomplete="name">
<label>Téléphone *</label><input id="p" inputmode="tel" autocomplete="tel">
<label>Adresse de livraison</label><input id="a" autocomplete="street-address">
<label>Précisions (facultatif)</label><textarea id="o" rows="2"></textarea>
<div id="err" role="alert"></div>
<button class="btn" id="b" onclick="send()">Envoyer la commande</button>
<p class="mu" style="font-size:13px">Aucun paiement n’est demandé ici : l’entreprise vous contactera pour confirmer.</p>`}
function qty(id,d){cart[id]=Math.max(0,Math.min(50,(cart[id]||0)+d));$('#q'+id).value=cart[id];
 $('#tt').textContent=fm(P.reduce((a,p)=>a+ +p.price*(cart[p.id]||0),0))}
function msg(t){$('#err').textContent=t}
async function send(){
 const items=P.filter(p=>cart[p.id]>0).map(p=>({product_id:p.id,qty:cart[p.id]})),name=$('#n').value.trim(),phone=$('#p').value.trim();
 if(!name||!phone)return msg('Nom et téléphone obligatoires');
 if(!items.length)return msg('Choisissez au moins un produit');
 msg('');$('#b').disabled=true;
 const{data,error}=await SB.rpc('public_create_order',{p_slug:slug,p_key:key,p_name:name,p_phone:phone,p_address:$('#a').value,p_items:items,p_notes:$('#o').value});
 if(error){$('#b').disabled=false;return msg(error.message)}
 $('#m').innerHTML=`<div class="card"><h1>Commande reçue ✓</h1><p>Référence : <b>${esc(data.ref)}</b><br>Total : <b>${fm(data.total)}</b></p><p class="mu">${esc(co)} vous contactera au numéro indiqué pour confirmer la commande et le paiement. Aucun paiement n’a été pris en ligne.</p></div>`}
init();
</script></body></html>
